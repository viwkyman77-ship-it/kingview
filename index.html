<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kingview — สวัสดีชาวโลก</title>
  <style>
    :root{--bg:#0f1720;--card:#0b1220;--accent:#ffb86b}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, "Noto Sans Thai", "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255,184,107,0.06), transparent),
                  radial-gradient(900px 400px at 90% 90%, rgba(99,102,241,0.04), transparent),
                  var(--bg);
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:100%;
      max-width:760px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:16px;
      padding:40px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      text-align:center;
    }
    h1{
      margin:0 0 8px;
      font-size:clamp(28px,6vw,48px);
      line-height:1.05;
      letter-spacing:-0.02em;
      background: linear-gradient(90deg,var(--accent), #63a4ff 60%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.lead{
      margin:0 0 20px;
      opacity:0.85;
      font-size:clamp(14px,2.2vw,18px);
    }
    .btn{
      display:inline-block;
      padding:10px 18px;
      border-radius:10px;
      text-decoration:none;
      font-weight:600;
      background:linear-gradient(90deg,#2dd4bf,#60a5fa);
      color:#07203a;
      box-shadow: 0 6px 18px rgba(32,58,80,0.35);
    }
    footer{margin-top:20px;opacity:0.6;font-size:13px}

    /* small typing effect for a little flair */
    .typing{
      display:inline-block;
      overflow:hidden;
      white-space:nowrap;
      border-right:3px solid rgba(230,238,248,0.6);
      animation: typing 3s steps(28,end) infinite, blink .7s step-end infinite;
      font-weight:700;
    }
    @keyframes typing{0%{width:0}50%{width:100%}100%{width:100%}}
    @keyframes blink{50%{border-color:transparent}}

    @media (max-width:480px){.card{padding:28px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1><span class="typing">สวัสดีชาวโลกข้าคือ kingview</span></h1>
    <p class="lead">ยินดีต้อนรับ — หน้านี้แสดงข้อความตามที่คุณต้องการ</p>

    <div>
      <a class="btn" href="#" onclick="copyText();return false;">คัดลอกข้อความ</a>
    </div>

    <footer>ทำด้วย ❤️ โดย Kingview</footer>
  </main>

  <script>
    function copyText(){
      const text = 'สวัสดีชาวโลกข้าคือ kingview';
      navigator.clipboard?.writeText(text).then(()=>{
        alert('คัดลอกเรียบร้อย: ' + text);
      }).catch(()=>{alert('ไม่สามารถคัดลอกอัตโนมัติ — กรุณาคัดลอกด้วยตัวเอง')});
    }
  </script>
</body>
</html>
